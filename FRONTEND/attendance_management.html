<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow - Attendance Management</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f5f8fc; color: #1f2937; }
        .header { height: 70px; background-color: white; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
        .logo { font-size: 26px; font-weight: bold; color: #1677d2; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .user-name { color: #374151; font-size: 15px; }
        .logout { border: 1px solid #d1d5db; background-color: white; padding: 9px 16px; border-radius: 7px; cursor: pointer; }
        .logout:hover { background-color: #f3f4f6; }
        .layout { display: flex; min-height: calc(100vh - 70px); }
        .sidebar { width: 240px; background-color: #102a43; padding: 25px 15px; }
        .sidebar-title { color: #8fa8bf; font-size: 11px; font-weight: bold; padding: 0 15px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .sidebar a { display: block; text-decoration: none; color: #cbd5e1; padding: 13px 15px; margin-bottom: 5px; border-radius: 7px; font-size: 15px; }
        .sidebar a:hover { background-color: #1c3b5a; color: white; }
        .sidebar a.active { background-color: #1677d2; color: white; }
        .content { flex: 1; padding: 35px; max-width: 1250px; }
        .page-title { margin-bottom: 25px; }
        .page-title h1 { font-size: 30px; margin-bottom: 7px; }
        .page-title p { color: #6b7280; }
        .attendance-card { background-color: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 25px; }
        .attendance-card h2 { font-size: 20px; margin-bottom: 20px; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 15px 12px; border-bottom: 1px solid #edf1f5; font-size: 14px; }
        th { color: #6b7280; font-size: 13px; font-weight: 600; }
        tbody tr:hover { background-color: #f8fafc; }
        .employee { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; background-color: #e5f1ff; color: #1677d2; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }
        .employee-name { font-weight: 600; }
        .employee-id { color: #6b7280; font-size: 12px; margin-top: 3px; }
        .status { display: inline-block; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .present { background-color: #e9f8ef; color: #23733d; }
        .on-leave { background-color: #eaf3ff; color: #1677d2; }
        .absent { background-color: #fff0f0; color: #a52e2e; }
        @media (max-width: 750px) { .layout { flex-direction: column; } .sidebar { width: 100%; display: flex; overflow-x: auto; padding: 15px; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">dayflow</div>
        <div class="header-right">
            <span class="user-name">HR Manager</span>
            <button class="logout" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-title">HR Management</div>
            <a href="hr_home.html">Dashboard</a>
            <a href="employees.html">Employees</a>
            <a href="attendance_management.html" class="active">Attendance</a>
            <a href="leave_approvals.html">Leave Requests</a>
            <a href="payroll_management.html">Payroll</a>
        </aside>

        <main class="content">
            <div class="page-title">
                <h1>Attendance Management</h1>
                <p>Monitor and manage employee attendance for today.</p>
            </div>

            <div class="attendance-card">
                <h2>Today's Attendance Logs</h2>
                <div class="table-container">
                    <table id="attendanceTable">
                        <thead>
                            <tr>
                                <th>Employee</th>
                                <th>Date</th>
                                <th>Check In</th>
                                <th>Check Out</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="5">Loading attendance records...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        async function loadAdminAttendance() {
            try {
                const response = await fetch("http://127.0.0.1:5000/api/admin/attendance/today");
                const result = await response.json();
                const tbody = document.querySelector("#attendanceTable tbody");
                tbody.innerHTML = ""; 
                
                if (response.ok && result.data && result.data.length > 0) {
                    result.data.forEach(rec => {
                        const initials = rec.Name ? rec.Name.substring(0,2).toUpperCase() : "EMP";
                        const statusClass = rec.Status === 'Present' ? 'present' : (rec.Status === 'Leave' ? 'on-leave' : 'absent');
                        
                        tbody.innerHTML += `
                        <tr>
                            <td>
                                <div class="employee">
                                    <div class="avatar">${initials}</div>
                                    <div>
                                        <div class="employee-name">${rec.Name || 'Unknown'}</div>
                                        <div class="employee-id">ID: ${rec.Employee_ID}</div>
                                    </div>
                                </div>
                            </td>
                            <td>${rec.Log_Date ? new Date(rec.Log_Date).toLocaleDateString() : '--'}</td>
                            <td>${rec.Check_In_Time || '--'}</td>
                            <td>${rec.Check_Out_Time || '--'}</td>
                            <td><span class="status ${statusClass}">${rec.Status}</span></td>
                        </tr>`;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="5">No attendance records found for today.</td></tr>`;
                }
            } catch (error) { console.error("Error connecting to API:", error); }
        }

        function logout() { localStorage.clear(); window.location.href = "login.html"; }
        loadAdminAttendance();
    </script>
</body>
</html>
