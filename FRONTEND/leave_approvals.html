<script>
        async function loadPendingLeaves() {
            try {
                const response = await fetch("http://127.0.0.1:5000/api/admin/leave/pending");
                const result = await response.json();
                
                const tbody = document.querySelector("#leaveTable tbody");
                tbody.innerHTML = ""; // Clear hardcoded data
                
                if (response.ok && result.data && result.data.length > 0) {
                    result.data.forEach(req => {
                        const initials = req.Name ? req.Name.substring(0,2).toUpperCase() : "EMP";
                        
                        tbody.innerHTML += `
                        <tr>
                            <td>
                                <div class="employee">
                                    <div class="avatar">${initials}</div>
                                    <div>
                                        <div class="employee-name">${req.Name || 'Unknown'}</div>
                                        <div class="employee-id">ID: ${req.Employee_ID}</div>
                                    </div>
                                </div>
                            </td>
                            <td class="leave-type">${req.Leave_Type}</td>
                            <td>${new Date(req.Start_Date).toLocaleDateString()} to ${new Date(req.End_Date).toLocaleDateString()}</td>
                            <td>--</td>
                            <td class="reason">${req.Remarks || '--'}</td>
                            <td><span class="status pending">Pending</span></td>
                            <td>
                                <div class="actions">
                                    <button class="action-button approve-button" onclick="alert('Needs backend update route!')">Approve</button>
                                    <button class="action-button reject-button" onclick="alert('Needs backend update route!')">Reject</button>
                                </div>
                            </td>
                        </tr>`;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="7">No pending requests! You are all caught up.</td></tr>`;
                }
            } catch (error) { 
                console.error("Error connecting to API:", error); 
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }

        loadPendingLeaves();
    </script>
