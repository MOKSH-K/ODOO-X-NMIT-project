<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dayflow - Login</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            min-height: 100vh;

            background-color: #f5f8fc;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        /* ================= CONTAINER ================= */

        .container {

            width: 900px;

            max-width: 100%;

            min-height: 560px;

            background-color: white;

            border-radius: 15px;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);

            display: grid;

            grid-template-columns: 1fr 1fr;

            overflow: hidden;
        }


        /* ================= LEFT SIDE ================= */

        .left {

            background-color: #102a43;

            color: white;

            padding: 50px 40px;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .logo {

            font-size: 32px;

            font-weight: bold;

            color: #5da9e9;

            margin-bottom: 25px;
        }


        .left h1 {

            font-size: 32px;

            line-height: 1.25;

            margin-bottom: 15px;
        }


        .left p {

            color: #cbd5e1;

            line-height: 1.7;

            font-size: 15px;
        }


        .features {

            margin-top: 30px;
        }


        .feature {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 14px;

            color: #dbeafe;

            font-size: 14px;
        }


        .check {

            width: 23px;

            height: 23px;

            border-radius: 50%;

            background-color: #1677d2;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 12px;
        }


        /* ================= RIGHT SIDE ================= */

        .right {

            padding: 45px;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .right h2 {

            font-size: 28px;

            margin-bottom: 8px;
        }


        .subtitle {

            color: #6b7280;

            font-size: 14px;

            margin-bottom: 25px;
        }


        /* ================= TABS ================= */

        .tabs {

            display: flex;

            border-bottom: 1px solid #e5e7eb;

            margin-bottom: 25px;
        }


        .tab {

            flex: 1;

            border: none;

            background: none;

            padding: 12px;

            font-size: 15px;

            color: #6b7280;

            cursor: pointer;

            border-bottom: 2px solid transparent;
        }


        .tab.active {

            color: #1677d2;

            border-bottom-color: #1677d2;

            font-weight: bold;
        }


        /* ================= FORM ================= */

        .form {

            display: none;
        }


        .form.active {

            display: block;
        }


        .form-group {

            margin-bottom: 17px;
        }


        .form-group label {

            display: block;

            font-size: 13px;

            color: #374151;

            font-weight: 600;

            margin-bottom: 7px;
        }


        input,
        select {

            width: 100%;

            padding: 12px 13px;

            border: 1px solid #d9e1eb;

            border-radius: 7px;

            outline: none;

            background-color: white;

            color: #1f2937;

            font-size: 14px;
        }


        input:focus,
        select:focus {

            border-color: #1677d2;

            box-shadow: 0 0 0 3px #1677d21a;
        }


        /* ================= ROLE ================= */

        .role-box {

            background-color: #f5f9ff;

            border: 1px solid #dbeafe;

            border-radius: 8px;

            padding: 12px;

            margin-bottom: 18px;
        }


        .role-box label {

            display: block;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 7px;

            color: #374151;
        }


        /* ================= BUTTON ================= */

        .submit-button {

            width: 100%;

            border: none;

            background-color: #1677d2;

            color: white;

            padding: 13px;

            border-radius: 7px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }


        .submit-button:hover {

            background-color: #0f63b5;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .container {

                grid-template-columns: 1fr;
            }


            .left {

                display: none;
            }


            .right {

                padding: 35px 25px;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- ================= LEFT ================= -->

        <div class="left">

            <div class="logo">
                dayflow
            </div>


            <h1>
                Work smarter.<br>
                Flow better.
            </h1>


            <p>
                A simple workplace management system
                for employees and HR teams.
            </p>


            <div class="features">

                <div class="feature">

                    <span class="check">
                        ✓
                    </span>

                    Attendance management

                </div>


                <div class="feature">

                    <span class="check">
                        ✓
                    </span>

                    Leave management

                </div>


                <div class="feature">

                    <span class="check">
                        ✓
                    </span>

                    Payroll management

                </div>


                <div class="feature">

                    <span class="check">
                        ✓
                    </span>

                    Employee management

                </div>

            </div>

        </div>



        <!-- ================= RIGHT ================= -->

        <div class="right">


            <h2>
                Welcome to Dayflow
            </h2>


            <p class="subtitle">
                Sign in to continue or create a new account.
            </p>



            <!-- ================= TABS ================= -->

            <div class="tabs">

                <button
                    class="tab active"
                    onclick="showForm('signin', this)"
                >
                    Sign In
                </button>


                <button
                    class="tab"
                    onclick="showForm('signup', this)"
                >
                    Sign Up
                </button>

            </div>



            <!-- ================================================= -->
            <!-- SIGN IN -->
            <!-- ================================================= -->

            <form
                id="signin"
                class="form active"
                onsubmit="login(event)"
            >


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>



                <!-- ROLE -->

                <div class="role-box">

                    <label>
                        Login as
                    </label>

                    <select
                        id="loginRole"
                        required
                    >

                        <option value="">
                            Select your role
                        </option>

                        <option value="employee">
                            Employee
                        </option>

                        <a href="hr_home.html">
                        <option value="hr">
                            HR
                        </option>
                        </a>

                    </select>

                </div>



                <button
                    type="submit"
                    class="submit-button"
                >
                    Sign In
                </button>


            </form>



            <!-- ================================================= -->
            <!-- SIGN UP -->
            <!-- ================================================= -->

            <form
                id="signup"
                class="form"
                onsubmit="signup(event)"
            >


                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        placeholder="Enter your full name"
                        required
                    >

                </div>



                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        placeholder="Create a password"
                        required
                    >

                </div>



                <!-- ROLE -->

                <div class="role-box">

                    <label>
                        Account Role
                    </label>

                    <select
                        id="signupRole"
                        required
                    >

                        <option value="">
                            Select your role
                        </option>

                        <option value="employee">
                            Employee
                        </option>

                        <option value="hr">
                            HR
                        </option>

                    </select>

                </div>



                <button
                    type="submit"
                    class="submit-button"
                >
                    Create Account
                </button>


            </form>


        </div>

    </div>



    <!-- ================= JAVASCRIPT ================= -->

    <script>


        /* ================= SWITCH FORMS ================= */

        function showForm(formId, button) {

            document
                .querySelectorAll(".form")
                .forEach(form => {

                    form.classList.remove("active");

                });


            document
                .querySelectorAll(".tab")
                .forEach(tab => {

                    tab.classList.remove("active");

                });


            document
                .getElementById(formId)
                .classList.add("active");


            button.classList.add("active");

        }



        /* ================= LOGIN ================= */

        function login(event) {

            event.preventDefault();


            const role =
                document.getElementById("loginRole").value;


            if (role === "employee") {

                window.location.href =
                    "home_page.html";

            }


            else if (role === "hr") {

                window.location.href =
                    "hr_home.html";

            }


            else {

                alert("Please select your role.");

            }

        }



        /* ================= SIGN UP ================= */

        function signup(event) {

            event.preventDefault();


            const role =
                document.getElementById("signupRole").value;


            if (role === "employee") {

                window.location.href =
                    "home_page.html";

            }


            else if (role === "hr") {

                window.location.href =
                    "hr_home.html";

            }


            else {

                alert("Please select your role.");

            }

        }

    </script>


</body>

</html>
