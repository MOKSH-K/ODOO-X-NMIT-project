<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow - Leave Requests</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f5f8fc; color: #1f2937; }
        .header { height: 70px; background-color: white; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
        .logo { font-size: 26px; font-weight: bold; color: #1677d2; }
        .logout { border: 1px solid #d1d5db; background-color: white; padding: 9px 16px; border-radius: 7px; cursor: pointer; }
        .layout { display: flex; min-height: calc(100vh - 70px); }
        .sidebar { width: 230px; background-color: #102a43; padding: 25px 15px; }
        .sidebar a { display: block; text-decoration: none; color: #cbd5e1; padding: 13px 15px; margin-bottom: 5px; border-radius: 7px; font-size: 15px; }
        .sidebar a:hover { background-color: #1c3b5a; color: white; }
        .sidebar a.active { background-color: #1677d2; color: white; }
        .content { flex: 1; padding: 35px; max-width: 1000px; }
        .card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 25px; margin-bottom: 25px; }
        .field { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #6b7280; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #d9e1eb; border-radius: 6px; outline: none; }
        button.submit-btn { background: #1677d2; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 14px; border-bottom: 1px solid #edf1f5; font-size: 14px; }
        th { color: #6b7280; font-size: 13px; }
        .status { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .pending { background: #fff5df; color: #966514; }
        @media (max-width: 750px) { .layout { flex-direction: column; } .sidebar { width: 100%; display: flex; overflow-x: auto; padding: 15px; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">dayflow</div>
        <button class="logout" onclick="logout()">Logout</button>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <a href="homepage.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="attendance.html">Attendance</a>
            <a href="leave.html" class="active">Leave Requests</a>
            <a href="payroll.html">Salary Details</a>
        </aside>

        <main class="content">
            <div class="card">
                <h2>Apply for Leave</h2><br>
                <form id="leaveForm" onsubmit="submitLeave(event)">
                    <div class="field">
                        <label>Leave Type</label>
                        <select id="leaveType" required>
                            <option value="Casual Leave">Casual Leave</option>
                            <option value="Sick Leave">Sick Leave</option>
                            <option value="Earned Leave">Earned Leave</option>
                        </select>
                    </div>
                    <div class="field"><label>Start Date</label><input type="date" id="startDate" required></div>
                    <div class="field"><label>End Date</label><input type="date" id="endDate" required></div>
                    <div class="field"><label>Remarks / Reason</label><textarea id="remarks" rows="3" required></textarea></div>
                    <button type="submit" class="submit-btn" id="subBtn">Submit Request</button>
                </form>
            </div>

            <div class="card">
                <h2>My Leave History</h2>
                <table>
                    <thead>
                        <tr><th>Type</th><th>Start</th><th>End</th><th>Remarks</th><th>Status</th></tr>
                    </thead>
                    <tbody id="leaveHistory">
                        <tr><td colspan="5">Loading history...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const empId = parseInt(localStorage.getItem("employee_id"));
        if (!empId) window.location.href = "login.html";

        async function loadLeaves() {
            try {
                const response = await fetch(`http://127.0.0.1:5000/api/leave/history/${empId}`);
                const result = await response.json();
                const tbody = document.getElementById("leaveHistory");
                tbody.innerHTML = "";
                if (response.ok && result.data && result.data.length > 0) {
                    result.data.forEach(l => {
                        tbody.innerHTML += `
                        <tr>
                            <td>${l.Leave_Type}</td>
                            <td>${new Date(l.Start_Date).toLocaleDateString()}</td>
                            <td>${new Date(l.End_Date).toLocaleDateString()}</td>
                            <td>${l.Remarks || '--'}</td>
                            <td><span class="status pending">${l.Status}</span></td>
                        </tr>`;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="5">No leave requests submitted yet.</td></tr>`;
                }
            } catch (e) { console.error(e); }
        }

        async function submitLeave(event) {
            event.preventDefault();
            const btn = document.getElementById("subBtn");
            btn.textContent = "Submitting...";

            const payload = {
                Employee_ID: empId,
                Leave_Type: document.getElementById("leaveType").value,
                Start_Date: document.getElementById("startDate").value,
                End_Date: document.getElementById("endDate").value,
                Remarks: document.getElementById("remarks").value,
                Status: "Pending"
            };

            try {
                const response = await fetch("http://127.0.0.1:5000/api/insert/LeaveRequests", {
                    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
                });
                if (response.ok) {
                    alert("Leave request submitted successfully!");
                    document.getElementById("leaveForm").reset();
                    loadLeaves();
                } else {
                    alert("Failed to submit request.");
                }
            } catch (e) { alert("Server error."); }
            finally { btn.textContent = "Submit Request"; }
        }

        function logout() { localStorage.clear(); window.location.href = "login.html"; }
        loadLeaves();
    </script>
</body>
</html>
