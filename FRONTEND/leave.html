<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow - Leave</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f5f8fc; color: #1f2937; }
        .header { height: 70px; background-color: white; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; padding: 0 40px;}
        .logo { font-size: 26px; font-weight: bold; color: #1677d2; }
        .logout { border: 1px solid #d1d5db; padding: 9px 16px; border-radius: 7px; cursor: pointer; }
        .layout { display: flex; min-height: calc(100vh - 70px); }
        .sidebar { width: 230px; background-color: #102a43; padding: 25px 15px; }
        .sidebar a { display: block; text-decoration: none; color: #cbd5e1; padding: 13px 15px; margin-bottom: 5px; border-radius: 7px; }
        .sidebar a.active { background-color: #1677d2; color: white; }
        .content { flex: 1; padding: 35px; }
        .request-card, .history-card { background-color: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 25px; margin-bottom: 20px;}
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom:15px; }
        .form-group { display: flex; flex-direction: column; gap: 7px; }
        input, select, textarea { border: 1px solid #d9e1eb; border-radius: 8px; padding: 12px; width: 100%;}
        .submit-button { background-color: #1677d2; color: white; padding: 12px 23px; border: none; border-radius: 7px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 14px; border-bottom: 1px solid #edf1f5; font-size: 14px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">dayflow</div>
        <button class="logout" onclick="logout()">Logout</button>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <a href="homepage.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="attendance.html">Attendance</a>
            <a href="leave.html" class="active">Leave Requests</a>
            <a href="payroll.html">Payroll</a>
        </aside>

        <main class="content">
            <div class="request-card">
                <h2>Request Leave</h2><br>
                <form id="leaveForm" onsubmit="submitLeave(event)">
                    <div class="form-grid">
                        <div class="form-group"><label>Leave Type</label><select id="l-type"><option>Paid Leave</option><option>Sick Leave</option></select></div>
                        <div class="form-group"><label>Reason</label><input type="text" id="l-reason" required></div>
                        <div class="form-group"><label>From Date</label><input type="date" id="l-start" required></div>
                        <div class="form-group"><label>To Date</label><input type="date" id="l-end" required></div>
                    </div>
                    <button type="submit" class="submit-button" id="submitBtn">Submit Request</button>
                </form>
            </div>

            <div class="history-card">
                <h2>My Leave Requests</h2><br>
                <table>
                    <thead><tr><th>Type</th><th>From</th><th>To</th><th>Status</th></tr></thead>
                    <tbody id="leave-tbody">
                        <tr><td colspan="4">Loading leaves...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const empId = localStorage.getItem("employee_id");
        if (!empId) window.location.href = "login.html";

        async function submitLeave(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.textContent = "Submitting...";
            
            const data = {
                Employee_ID: parseInt(empId),
                Leave_Type: document.getElementById('l-type').value,
                Start_Date: document.getElementById('l-start').value,
                End_Date: document.getElementById('l-end').value,
                Remarks: document.getElementById('l-reason').value,
                Status: "Pending"
            };

            try {
                const response = await fetch("http://127.0.0.1:5000/api/insert/LeaveRequests", {
                    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data)
                });
                if (response.ok) {
                    alert("Leave Submitted Successfully!");
                    document.getElementById('leaveForm').reset();
                    loadLeaves(); // Refresh the table
                }
            } catch (error) { alert("Error submitting request."); }
            finally { btn.textContent = "Submit Request"; }
        }

        async function loadLeaves() {
            try {
                const response = await fetch(`http://127.0.0.1:5000/api/leave/history/${empId}`);
                const result = await response.json();
                const tbody = document.getElementById('leave-tbody');
                tbody.innerHTML = '';
                
                if (response.ok && result.data && result.data.length > 0) {
                    result.data.forEach(req => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td>${req.Leave_Type}</td><td>${new Date(req.Start_Date).toLocaleDateString()}</td><td>${new Date(req.End_Date).toLocaleDateString()}</td><td>${req.Status}</td>`;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="4">No history found.</td></tr>';
                }
            } catch (error) { console.error(error); }
        }

        function logout() { localStorage.clear(); window.location.href = "login.html"; }
        loadLeaves();
    </script>
</body>
</html>
