<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow - My Profile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f5f8fc; color: #1f2937; }
        .header { height: 70px; background-color: white; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
        .logo { font-size: 26px; font-weight: bold; color: #1677d2; }
        .logout { border: 1px solid #d1d5db; background-color: white; padding: 9px 16px; border-radius: 7px; cursor: pointer; }
        .layout { display: flex; min-height: calc(100vh - 70px); }
        .sidebar { width: 230px; background-color: #102a43; padding: 25px 15px; }
        .sidebar a { display: block; text-decoration: none; color: #cbd5e1; padding: 13px 15px; margin-bottom: 5px; border-radius: 7px; font-size: 15px; }
        .sidebar a:hover { background-color: #1c3b5a; color: white; }
        .sidebar a.active { background-color: #1677d2; color: white; }
        .content { flex: 1; padding: 35px; max-width: 900px; }
        .card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .item label { display: block; color: #6b7280; font-size: 13px; margin-bottom: 5px; }
        .item span { font-size: 16px; font-weight: 600; }
        @media (max-width: 750px) { .layout { flex-direction: column; } .sidebar { width: 100%; display: flex; overflow-x: auto; padding: 15px; } .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">dayflow</div>
        <button class="logout" onclick="logout()">Logout</button>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <a href="homepage.html">Dashboard</a>
            <a href="profile.html" class="active">Profile</a>
            <a href="attendance.html">Attendance</a>
            <a href="leave.html">Leave Requests</a>
            <a href="payroll.html">Salary Details</a>
        </aside>

        <main class="content">
            <div class="card">
                <h2>My Profile Details</h2>
                <div class="grid">
                    <div class="item"><label>Employee ID</label><span id="p-id">Loading...</span></div>
                    <div class="item"><label>Full Name</label><span id="p-name">Loading...</span></div>
                    <div class="item"><label>Email Address</label><span id="p-email">Loading...</span></div>
                    <div class="item"><label>Department</label><span id="p-dept">Loading...</span></div>
                    <div class="item"><label>Designation</label><span id="p-desig">Loading...</span></div>
                    <div class="item"><label>Phone Number</label><span id="p-phone">Loading...</span></div>
                    <div class="item"><label>Date of Joining</label><span id="p-doj">Loading...</span></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const empId = localStorage.getItem("employee_id");
        if (!empId) window.location.href = "login.html";

        async function loadProfile() {
            try {
                const response = await fetch(`http://127.0.0.1:5000/api/profile/${empId}`);
                const result = await response.json();
                if (response.ok && result.data) {
                    const d = result.data;
                    document.getElementById("p-id").innerText = d.Employee_ID || '--';
                    document.getElementById("p-name").innerText = d.Name || 'Profile incomplete (Ask HR)';
                    document.getElementById("p-email").innerText = d.Email || '--';
                    document.getElementById("p-dept").innerText = d.Department || '--';
                    document.getElementById("p-desig").innerText = d.Designation || '--';
                    document.getElementById("p-phone").innerText = d.Phone_no || '--';
                    document.getElementById("p-doj").innerText = d.DOJ ? new Date(d.DOJ).toLocaleDateString() : '--';
                }
            } catch (e) { console.error(e); }
        }

        function logout() { localStorage.clear(); window.location.href = "login.html"; }
        loadProfile();
    </script>
</body>
</html>
