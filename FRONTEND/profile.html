<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow - My Profile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f5f8fc; color: #1f2937; }
        .header { height: 70px; background-color: white; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
        .logo { font-size: 26px; font-weight: bold; color: #1677d2; }
        .logout { border: 1px solid #d1d5db; background-color: white; padding: 9px 16px; border-radius: 7px; cursor: pointer; }
        .layout { display: flex; min-height: calc(100vh - 70px); }
        .sidebar { width: 230px; background-color: #102a43; padding: 25px 15px; }
        .sidebar a { display: block; text-decoration: none; color: #cbd5e1; padding: 13px 15px; margin-bottom: 5px; border-radius: 7px; font-size: 15px; }
        .sidebar a.active { background-color: #1677d2; color: white; }
        .content { flex: 1; padding: 35px; max-width: 1100px; }
        .profile-card { background-color: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 30px; }
        .profile-top { display: flex; align-items: center; gap: 25px; padding-bottom: 25px; border-bottom: 1px solid #e5e7eb; margin-bottom: 25px; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
        .detail label { font-size: 13px; color: #6b7280; }
        .detail p { font-size: 15px; background-color: #f8fafc; border: 1px solid #e5e7eb; padding: 11px; border-radius: 7px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">dayflow</div>
        <button class="logout" onclick="logout()">Logout</button>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <a href="homepage.html">Dashboard</a>
            <a href="profile.html" class="active">Profile</a>
            <a href="attendance.html">Attendance</a>
            <a href="leave.html">Leave Requests</a>
            <a href="payroll.html">Payroll</a>
        </aside>

        <main class="content">
            <div class="profile-card">
                <div class="profile-top">
                    <div class="profile-info">
                        <h2 id="topName">Loading...</h2>
                        <p id="topRole">...</p>
                    </div>
                </div>

                <h3>Personal Information</h3><br>
                <div class="details-grid">
                    <div class="detail"><label>Employee ID</label><p id="p-id">...</p></div>
                    <div class="detail"><label>Full Name</label><p id="p-name">...</p></div>
                    <div class="detail"><label>Phone</label><p id="p-phone">...</p></div>
                    <div class="detail"><label>Department</label><p id="p-dept">...</p></div>
                    <div class="detail"><label>Designation</label><p id="p-desig">...</p></div>
                    <div class="detail"><label>Date of Joining</label><p id="p-doj">...</p></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const empId = localStorage.getItem("employee_id");
        if (!empId) window.location.href = "login.html";

        async function loadProfile() {
            try {
                const response = await fetch(`http://127.0.0.1:5000/api/profile/${empId}`);
                const result = await response.json();
                
                if (response.ok && result.data) {
                    const d = result.data;
                    document.getElementById('topName').innerText = d.Name || "N/A";
                    document.getElementById('topRole').innerText = d.Designation || "N/A";
                    document.getElementById('p-id').innerText = d.Employee_ID;
                    document.getElementById('p-name').innerText = d.Name || "N/A";
                    document.getElementById('p-phone').innerText = d.Phone_no || "N/A";
                    document.getElementById('p-dept').innerText = d.Department || "N/A";
                    document.getElementById('p-desig').innerText = d.Designation || "N/A";
                    document.getElementById('p-doj').innerText = d.DOJ || "N/A";
                }
            } catch (error) { console.error(error); }
        }

        function logout() { localStorage.clear(); window.location.href = "login.html"; }
        loadProfile();
    </script>
</body>
</html>
