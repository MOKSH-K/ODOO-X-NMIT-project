<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow - HR Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f5f8fc; color: #1f2937; }
        .header { height: 70px; background-color: white; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
        .logo { font-size: 26px; font-weight: bold; color: #1677d2; }
        .logout { border: 1px solid #d1d5db; background-color: white; padding: 9px 16px; border-radius: 7px; cursor: pointer; }
        .layout { display: flex; min-height: calc(100vh - 70px); }
        .sidebar { width: 240px; background-color: #102a43; padding: 25px 15px; }
        .sidebar-title { color: #8fa8bf; font-size: 11px; font-weight: bold; padding: 0 15px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .sidebar a { display: block; text-decoration: none; color: #cbd5e1; padding: 13px 15px; margin-bottom: 5px; border-radius: 7px; font-size: 15px; }
        .sidebar a:hover { background-color: #1c3b5a; color: white; }
        .sidebar a.active { background-color: #1677d2; color: white; }
        .content { flex: 1; padding: 35px; max-width: 1200px; }
        .page-title h1 { font-size: 30px; margin-bottom: 7px; }
        .page-title p { color: #6b7280; margin-bottom: 25px; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .stat-card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 25px; }
        .stat-card small { color: #6b7280; font-size: 14px; }
        .stat-card strong { display: block; font-size: 36px; margin-top: 10px; color: #1677d2; }
        @media (max-width: 750px) { .layout { flex-direction: column; } .sidebar { width: 100%; display: flex; overflow-x: auto; padding: 15px; } .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">dayflow</div>
        <button class="logout" onclick="logout()">Logout</button>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-title">HR Management</div>
            <a href="hr_home.html" class="active">Dashboard</a>
            <a href="employees.html">Employees</a>
            <a href="attendance_management.html">Attendance</a>
            <a href="leave_approvals.html">Leave Requests</a>
            <a href="payroll_management.html">Payroll</a>
        </aside>

        <main class="content">
            <div class="page-title">
                <h1>HR Dashboard</h1>
                <p>Welcome back, HR Manager. Here is your organization overview.</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <small>Total Headcount</small>
                    <strong id="total-headcount">Loading...</strong>
                </div>
                <div class="stat-card">
                    <small>Employees On Leave Today</small>
                    <strong id="on-leave-count" style="color: #23733d;">Loading...</strong>
                </div>
            </div>
        </main>
    </div>

    <script>
        async function loadDashboardMetrics() {
            try {
                const response = await fetch("http://127.0.0.1:5000/api/admin/dashboard");
                const result = await response.json();
                if (response.ok && result.data) {
                    document.getElementById("total-headcount").innerText = result.data.total_employees;
                    document.getElementById("on-leave-count").innerText = result.data.on_leave_today;
                }
            } catch (error) { console.error("Error loading metrics:", error); }
        }

        function logout() { localStorage.clear(); window.location.href = "login.html"; }
        loadDashboardMetrics();
    </script>
</body>
</html>
