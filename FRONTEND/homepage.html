<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow - Employee Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f5f8fc; color: #1f2937; }
        .header { height: 70px; background-color: white; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
        .logo { font-size: 26px; font-weight: bold; color: #1677d2; }
        .logout { border: 1px solid #d1d5db; background-color: white; padding: 9px 16px; border-radius: 7px; cursor: pointer; }
        .layout { display: flex; min-height: calc(100vh - 70px); }
        .sidebar { width: 230px; background-color: #102a43; padding: 25px 15px; }
        .sidebar a { display: block; text-decoration: none; color: #cbd5e1; padding: 13px 15px; margin-bottom: 5px; border-radius: 7px; font-size: 15px; }
        .sidebar a:hover { background-color: #1c3b5a; color: white; }
        .sidebar a.active { background-color: #1677d2; color: white; }
        .content { flex: 1; padding: 35px; max-width: 1150px; }
        .welcome-card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 30px; margin-bottom: 25px; }
        .welcome-card h1 { font-size: 28px; margin-bottom: 8px; color: #102a43; }
        .welcome-card p { color: #6b7280; }
        @media (max-width: 750px) { .layout { flex-direction: column; } .sidebar { width: 100%; display: flex; overflow-x: auto; padding: 15px; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">dayflow</div>
        <button class="logout" onclick="logout()">Logout</button>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <a href="homepage.html" class="active">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="attendance.html">Attendance</a>
            <a href="leave.html">Leave Requests</a>
            <a href="payroll.html">Salary Details</a>
        </aside>

        <main class="content">
            <div class="welcome-card">
                <h1 id="welcomeTitle">Welcome Back!</h1>
                <p>Here is your daily overview. Use the sidebar to check your profile, attendance, leaves, or payslips.</p>
            </div>
        </main>
    </div>

    <script>
        const empId = localStorage.getItem("employee_id");
        if (!empId) window.location.href = "login.html";

        async function loadUser() {
            try {
                const response = await fetch(`http://127.0.0.1:5000/api/profile/${empId}`);
                const result = await response.json();
                if (response.ok && result.data && result.data.Name) {
                    document.getElementById("welcomeTitle").innerText = `Welcome Back, ${result.data.Name}!`;
                }
            } catch (e) { console.error(e); }
        }

        function logout() { localStorage.clear(); window.location.href = "login.html"; }
        loadUser();
    </script>
</body>
</html>
