<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dayflow | Home</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Inter, Arial, sans-serif; }
    body { background: #f5f7fb; color: #182230; min-height: 100vh; }
    .navbar { height: 72px; background: white; border-bottom: 1px solid #eaecf0; display: flex; align-items: center; justify-content: space-between; padding: 0 6%; position: sticky; top: 0; z-index: 10; }
    .logo { font-size: 26px; font-weight: 800; letter-spacing: -1px; color: #172554; }
    .logo span { color: #2563eb; }
    .nav-right { display: flex; align-items: center; gap: 18px; }
    .logout-btn { border: 1px solid #d1d5db; background-color: white; padding: 7px 14px; border-radius: 7px; cursor: pointer; }
    .container { width: min(1100px, 88%); margin: 0 auto; padding: 42px 0 60px; }
    .hero { background: linear-gradient(135deg, #172554, #2563eb); color: white; border-radius: 22px; padding: 36px 40px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .hero-content h1 { font-size: 32px; margin-bottom: 10px; }
    .date-box { background: rgba(255,255,255,0.12); border-radius: 14px; padding: 17px 22px; text-align: center; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .card { background: white; border: 1px solid #eaecf0; border-radius: 16px; padding: 21px; text-decoration: none; color: inherit; transition: 0.2s ease; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(16, 24, 40, 0.08); }
    .card-icon { width: 40px; height: 40px; border-radius: 11px; background: #eff6ff; display: grid; place-items: center; margin-bottom: 17px; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">day<span>flow</span></div>
    <div class="nav-right">
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-content">
        <p>Employee Dashboard</p>
        <h1 id="welcomeMessage">Good morning, Loading... 👋</h1>
      </div>
      <div class="date-box">
        <div class="day">Today</div>
        <div class="date" id="date"></div>
      </div>
    </section>

    <section class="cards">
      <a href="profile.html" class="card"><div class="card-icon">👤</div><h3>My Profile</h3></a>
      <a href="attendance.html" class="card"><div class="card-icon">🕐</div><h3>Attendance</h3></a>
      <a href="leave.html" class="card"><div class="card-icon">📅</div><h3>Leave Requests</h3></a>
      <a href="payroll.html" class="card"><div class="card-icon">💳</div><h3>Salary Details</h3></a>
    </section>
  </main>

  <script>
    // 1. Check if logged in
    const empId = localStorage.getItem("employee_id");
    if (!empId) window.location.href = "login.html";

    // 2. Fetch Dashboard Profile
    async function loadDashboard() {
        try {
            const response = await fetch(`http://127.0.0.1:5000/api/profile/${empId}`);
            const result = await response.json();
            if (response.ok && result.data) {
                const firstName = result.data.Name.split(' ')[0];
                document.getElementById('welcomeMessage').innerText = `Good morning, ${firstName} 👋`;
            }
        } catch (error) {
            console.error("Error fetching data:", error);
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = "login.html";
    }

    document.getElementById("date").textContent = new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    loadDashboard();
  </script>
</body>
</html>
