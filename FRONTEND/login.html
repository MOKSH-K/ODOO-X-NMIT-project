<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dayflow | Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Inter, Arial, sans-serif; }
    body { min-height: 100vh; background: #f5f7fb; color: #182230; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .page { width: min(1100px, 100%); min-height: 650px; background: #ffffff; border-radius: 28px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; box-shadow: 0 20px 60px rgba(20, 35, 60, 0.12); }
    .brand-panel { background: linear-gradient(145deg, #172554, #1e3a8a); color: white; padding: 55px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
    .brand-panel::before, .brand-panel::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,0.06); }
    .brand-panel::before { width: 320px; height: 320px; right: -130px; top: -110px; }
    .brand-panel::after { width: 240px; height: 240px; left: -110px; bottom: -90px; }
    .logo { position: relative; z-index: 1; font-size: 27px; font-weight: 800; letter-spacing: -1px; }
    .logo span { color: #93c5fd; }
    .brand-content { position: relative; z-index: 1; max-width: 430px; }
    .brand-content h1 { font-size: clamp(38px, 4vw, 56px); line-height: 1.05; letter-spacing: -2px; margin-bottom: 20px; }
    .brand-content p { color: #dbeafe; font-size: 16px; line-height: 1.7; max-width: 390px; }
    .form-panel { padding: 55px clamp(30px, 5vw, 70px); display: flex; align-items: center; }
    .form-container { width: 100%; max-width: 420px; margin: auto; }
    .form-heading h2 { font-size: 32px; letter-spacing: -1px; margin-bottom: 8px; }
    .form-heading p { color: #667085; font-size: 14px; margin-bottom: 30px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; background: #f2f4f7; border-radius: 12px; padding: 4px; margin-bottom: 28px; }
    .tab { border: none; background: transparent; padding: 11px; border-radius: 9px; cursor: pointer; font-weight: 600; color: #667085; transition: 0.2s; }
    .tab.active { background: white; color: #1d4ed8; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
    .form { display: none; }
    .form.active { display: block; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 8px; color: #344054; }
    input, select { width: 100%; height: 48px; border: 1px solid #d0d5dd; border-radius: 11px; padding: 0 14px; outline: none; background: white; color: #182230; font-size: 14px; transition: 0.2s; }
    input:focus, select:focus { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,0.09); }
    .main-btn { width: 100%; height: 50px; border: none; border-radius: 11px; background: #2563eb; color: white; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .main-btn:hover { background: #1d4ed8; transform: translateY(-1px); }
    .main-btn:disabled { opacity: 0.7; cursor: wait; transform: none; }
    .message { display: none; margin-top: 14px; padding: 11px 13px; border-radius: 9px; font-size: 12px; }
    .message.success { display: block; background: #ecfdf3; color: #027a48; }
    .message.error { display: block; background: #fef3f2; color: #b42318; }
    @media (max-width: 800px) { .page { grid-template-columns: 1fr; } .brand-panel { min-height: 360px; padding: 35px; } .form-panel { padding: 40px 28px; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="brand-panel">
      <div class="logo">day<span>flow</span></div>
      <div class="brand-content">
        <h1>Every workday,<br>perfectly aligned.</h1>
        <p>A simple workspace for employees and HR teams to manage profiles, attendance, leave and payroll in one place.</p>
      </div>
    </section>

    <section class="form-panel">
      <div class="form-container">
        <div class="form-heading">
          <h2 id="formTitle">Welcome back</h2>
          <p id="formSubtitle">Sign in to continue to your Dayflow workspace.</p>
        </div>

        <div class="tabs">
          <button class="tab active" id="loginTab" onclick="showForm('login')">Sign In</button>
          <button class="tab" id="signupTab" onclick="showForm('signup')">Sign Up</button>
        </div>

        <form class="form active" id="loginForm" onsubmit="handleLogin(event)">
          <div class="field">
            <label for="loginEmail">Email address</label>
            <input type="email" id="loginEmail" placeholder="you@company.com" required>
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
          </div>
          <button class="main-btn" id="loginButton" type="submit">Sign In</button>
          <div class="message" id="loginMessage"></div>
        </form>

        <form class="form" id="signupForm" onsubmit="handleSignup(event)">
          <div class="field">
            <label for="employeeId">Employee ID (Number only)</label>
            <input type="number" id="employeeId" placeholder="e.g. 103" required>
          </div>
          <div class="field">
            <label for="signupEmail">Email address</label>
            <input type="email" id="signupEmail" placeholder="you@company.com" required>
          </div>
          <div class="field">
            <label for="role">Role</label>
            <select id="role" required>
              <option value="Employee">Employee</option>
              <option value="Admin">HR / Admin</option>
            </select>
          </div>
          <div class="field">
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" placeholder="Create a password" minlength="8" required>
          </div>
          <button class="main-btn" id="signupButton" type="submit">Create Account</button>
          <div class="message" id="signupMessage"></div>
        </form>

      </div>
    </section>
  </main>

  <script>
    function showForm(type) {
      document.getElementById("loginForm").classList.toggle("active", type === 'login');
      document.getElementById("signupForm").classList.toggle("active", type === 'signup');
      document.getElementById("loginTab").classList.toggle("active", type === 'login');
      document.getElementById("signupTab").classList.toggle("active", type === 'signup');
    }

    function showMessage(elementId, text, type) {
      const el = document.getElementById(elementId);
      el.textContent = text;
      el.className = "message " + type;
    }

    async function handleSignup(event) {
      event.preventDefault();
      const button = document.getElementById("signupButton");
      button.disabled = true; button.textContent = "Creating...";

      const data = {
        Employee_ID: parseInt(document.getElementById("employeeId").value),
        Email: document.getElementById("signupEmail").value,
        UserRole: document.getElementById("role").value,
        password_hash: document.getElementById("signupPassword").value,
        email_ver: false
      };

      try {
        const response = await fetch("http://127.0.0.1:5000/api/insert/UserAndAuth", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data)
        });
        if (response.ok) {
          showMessage("signupMessage", "Account Created! Please log in.", "success");
          setTimeout(() => showForm("login"), 1500);
        } else {
          showMessage("signupMessage", "Error creating account", "error");
        }
      } catch (error) { showMessage("signupMessage", "Server connection failed.", "error"); }
      finally { button.disabled = false; button.textContent = "Create Account"; }
    }

    async function handleLogin(event) {
      event.preventDefault();
      const button = document.getElementById("loginButton");
      button.disabled = true; button.textContent = "Signing in...";

      const data = { Email: document.getElementById("loginEmail").value };

      try {
        const response = await fetch("http://127.0.0.1:5000/api/login", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data)
        });
        const result = await response.json();

        if (response.ok && result.data) {
          localStorage.setItem("employee_id", result.data.Employee_ID);
          localStorage.setItem("user_role", result.data.UserRole);
          
          showMessage("loginMessage", "Success! Redirecting...", "success");
          
          setTimeout(() => {
            const role = result.data.UserRole ? result.data.UserRole.toLowerCase() : "";
            if (role === "admin" || role === "hr") {
              window.location.href = "hr_home.html";
            } else {
              window.location.href = "homepage.html";
            }
          }, 1000);

        } else {
          showMessage("loginMessage", "User not found", "error");
        }
      } catch (error) { 
        showMessage("loginMessage", "Server connection failed.", "error"); 
      } finally { 
        button.disabled = false; 
        button.textContent = "Sign In"; 
      }
    }
  </script>
</body>
</html>
